<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 668" width="100%" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Heat pump bridge wiring</title>
<desc id="d">Pins 1 to 5 of the heat pump CN105 port and of header J_CN105_1 are 12V (not connected), GND, 5V, TX, RX. Pins GND, 5V (HV), TX and RX enter the 5 V side of the BOB-12009 level converter. On its 3.3 V side, header J_ESP32_1 pins 1 to 5 are 5V, GND, 3V3 (LV), RX, TX and go to ESP32-C3 pins 5V0, GND, 3V3, GPIO4 (RX) and GPIO5 (TX). The 5V net also runs from J_CN105_1 pin 3 straight to J_ESP32_1 pin 1, outside the converter. TX and RX cross: the heat pump TX goes to ESP32 RX.</desc>
<rect x="0" y="0" width="420" height="668" fill="#ffffff"/>
<rect x="4" y="6" width="94" height="62" rx="6" fill="#f2f4f7" stroke="#44546a" stroke-width="2"/>
<text x="51.0" y="26" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">CN105 =</text>
<text x="51.0" y="43" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">J_CN105_1</text>
<text x="51.0" y="60" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">pin</text>
<rect x="322" y="6" width="94" height="62" rx="6" fill="#f2f4f7" stroke="#44546a" stroke-width="2"/>
<text x="369.0" y="26" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">J_ESP32_1</text>
<text x="369.0" y="43" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">pin, then</text>
<text x="369.0" y="60" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">ESP32-C3 pin</text>
<rect x="128" y="98" width="82" height="318" rx="6" fill="#fff1e0" stroke="#a63d00" stroke-width="3"/>
<rect x="210" y="98" width="82" height="318" rx="6" fill="#e3f0fb" stroke="#0b4f8a" stroke-width="3" stroke-dasharray="7 5"/>
<text x="210" y="90" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">BOB-12009 level converter</text>
<text x="169" y="120" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">5 V side</text>
<text x="251" y="120" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">3.3 V side</text>
