<text x="14" y="588" font-size="14" text-anchor="start" font-weight="normal" fill="#111111">Pin 1 (square pad) is 12V. It is not connected.</text>
<text x="14" y="606" font-size="14" text-anchor="start" font-weight="normal" fill="#111111">TX and RX cross: heat pump TX goes to ESP32 RX</text>
<text x="14" y="624" font-size="14" text-anchor="start" font-weight="normal" fill="#111111">(GPIO4); ESP32 TX (GPIO5) goes to heat pump RX.</text>
<text x="14" y="642" font-size="14" text-anchor="start" font-weight="normal" fill="#111111">The cable is straight-through: pin n to pin n.</text>
<text x="14" y="660" font-size="14" text-anchor="start" font-weight="normal" fill="#111111">Unused converter pins: HV3, HV4, LV3, LV4.</text>
