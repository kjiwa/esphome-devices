<rect x="322" y="185" width="94" height="44" rx="6" fill="#ffffff" stroke="#44546a" stroke-width="2"/>
<text x="369.0" y="204" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">2: GND</text>
<text x="369.0" y="221" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">&gt; GND</text>
<rect x="4" y="245" width="94" height="44" rx="6" fill="#ffffff" stroke="#44546a" stroke-width="2"/>
