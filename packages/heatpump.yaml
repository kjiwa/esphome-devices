substitutions:
  friendly_name: Heat Pump
  board: esp32-c6-devkitm-1
  uart_rx_pin: GPIO2
  uart_tx_pin: GPIO1

esphome:
  name: ${name}
  friendly_name: ${friendly_name} (${area})
  area: ${area}

esp32:
  board: ${board}
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y

logger:
  level: INFO

api:
  encryption:
    key: !secret heatpump_api_encryption_key

ota:
  - platform: esphome
    password: !secret heatpump_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: ${name}
    password: !secret heatpump_ap_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/echavet/MitsubishiCN105ESPHome
      ref: 2026.5.1

uart:
  id: HP_UART
  baud_rate: 2400
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}

# Tune update_interval from the log lines of the form:
#   [09:48:36][I][CYCLE:052]: 6: Cycle ended in 1.2 seconds (with timeout?: NO)
# A value between 1s and 4s is recommended; for 1.2 seconds use about 1.5s.
climate:
  - platform: cn105
    id: hp
    name: None
    update_interval: 2s
    remote_temperature_timeout: 10min
    fahrenheit_compatibility: standard
    compressor_frequency_sensor:
      name: Compressor frequency
      entity_category: diagnostic
    outside_air_temperature_sensor:
      name: Outside air temperature
      entity_category: diagnostic
    input_power_sensor:
      name: Input power
      entity_category: diagnostic
    kwh_sensor:
      name: Energy
      entity_category: diagnostic
    runtime_hours_sensor:
      name: Runtime hours
      entity_category: diagnostic
    stage_sensor:
      name: Stage
      entity_category: diagnostic
    sub_mode_sensor:
      name: Sub mode
      entity_category: diagnostic
    error_code_sensor:
      name: Error code
      entity_category: diagnostic
    isee_sensor:
      name: ISEE
      entity_category: diagnostic
    remote_temperature_control_sensor:
      name: Room thermometer in use
      entity_category: diagnostic

switch:
  - platform: template
    name: Room thermometer
    id: use_room_temperature
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
      - lambda: id(hp).set_remote_temperature(0);

sensor:
  - platform: uptime
    name: Uptime

  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s

  # Home Assistant reports Fahrenheit; the heat pump takes Celsius. A reading
  # outside the range the unit accepts becomes NaN, so sending stops and the
  # unit falls back instead of holding a stale value.
  - platform: homeassistant
    id: room_temperature
    entity_id: ${room_temperature_entity}
    internal: true
    filters:
      - lambda: |-
          float c = (x - 32) * (5.0 / 9.0);
          return (c < 1 || c > 40) ? NAN : c;

# Each send resets the firmware's remote_temperature_timeout. Sending stops when
# the switch is off, Home Assistant is disconnected or the entity is unknown,
# and the unit then falls back to its own sensor.
interval:
  - interval: 1min
    then:
      - if:
          condition:
            and:
              - switch.is_on: use_room_temperature
              - api.connected:
              - lambda: return !std::isnan(id(room_temperature).state);
          then:
            - lambda: id(hp).set_remote_temperature(id(room_temperature).state);
