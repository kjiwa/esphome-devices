substitutions:
  esphome_name: acurite-bridge
  esphome_area: Kitchen
  esp32_board: ttgo-lora32-v21
  spi_clk_pin: GPIO5
  spi_mosi_pin: GPIO27
  spi_miso_pin: GPIO19
  sx127x_cs_pin: GPIO18
  sx127x_rst_pin: GPIO23
  sx127x_dio0_pin: GPIO26
  remote_receiver_pin: GPIO32

esphome:
  name: ${esphome_name}
  area: ${esphome_area}
  areas:
    - id: kitchen_area_id
      name: "Kitchen"
  devices:
    - id: kitchen_device_id
      name: "Kitchen Device"
      area_id: kitchen_area_id

esp32:
  board: ${esp32_board}
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret acurite_api_encryption_key

ota:
  - platform: esphome
    password: !secret acurite_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: ${esphome_name}
    password: !secret acurite_ap_password

captive_portal:

spi:
  clk_pin: ${spi_clk_pin}
  mosi_pin: ${spi_mosi_pin}
  miso_pin: ${spi_miso_pin}

sx127x:
  cs_pin: ${sx127x_cs_pin}
  rst_pin: ${sx127x_rst_pin}
  dio0_pin: ${sx127x_dio0_pin}
  frequency: 433920000
  modulation: OOK
  rx_start: true
  bandwidth: 50_0kHz
  packet_mode: false
  bitsync: true
  rx_floor: -90

remote_receiver:
  pin: ${remote_receiver_pin}
  dump: all

external_components:
  - source: github://swoboda1337/acurite-esphome@592fa3ce5df931fd55b936f5ff7307159d7b0413

acurite:

binary_sensor:
  - platform: acurite
    devices:
      - device: 0x0e14
        battery_level:
          name: "Mini Freezer Sensor Battery Level"
          device_id: kitchen_device_id
      - device: 0x0376
        battery_level:
          name: "Refrigerator Sensor Battery Level"
          device_id: kitchen_device_id
      - device: 0x01ef
        battery_level:
          name: "Freezer Sensor Battery Level"
          device_id: kitchen_device_id

sensor:
  - platform: acurite
    devices:
      - device: 0x0e14
        temperature:
          name: "Mini Freezer Temperature"
          device_id: kitchen_device_id
          force_update: true
        humidity:
          name: "Mini Freezer Humidity"
          device_id: kitchen_device_id
          force_update: true
      - device: 0x0376
        temperature:
          name: "Refrigerator Temperature"
          device_id: kitchen_device_id
          force_update: true
      - device: 0x01ef
        temperature:
          name: "Freezer Temperature"
          device_id: kitchen_device_id
          force_update: true
